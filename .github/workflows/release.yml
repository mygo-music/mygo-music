# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux and uploads their installers to a draft release of the tag, which
# is published by hand. Nothing is signed or notarized, and the app does
# not update itself: people download a release when the app, asked in its
# settings, tells them there is one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # The release page gets the version's section of CHANGELOG.md, which
      # the app shows too when it finds the release.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # Without a Developer ID the macOS app is signed ad hoc, which is all
      # Apple silicon needs to run it; Gatekeeper asks people to allow it.
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      # What people download: the disk images, the Windows installers, and
      # on Linux the Debian packages and the archives. `mygo build -upload`
      # needs the keys of the updates this app no longer has.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # bash 3.2 on macOS has no mapfile, and its xargs no -a.
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(
            find build -type f \( -name '*.dmg' -o -name '*-setup-*.exe' -o -name '*.deb' -o -name '*-linux-*.tar.gz' \) -print0
          )
          test "${#files[@]}" -gt 0
          ls -l "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
